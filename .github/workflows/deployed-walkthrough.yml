name: Deployed walkthrough

# The owner-to-caller shift, driven against the real deployment.
#
# Run from here rather than from a developer's machine for two reasons. The
# deployment's address is a repository secret, so it belongs somewhere that can
# read secrets without anybody pasting it around; and the machines this project
# is developed on sit behind an egress allowlist that does not include the
# deployment host, so a browser started there cannot reach it at all.
#
# Manual only. It signs in, creates a sandbox caller, assigns practice work and
# saves an outcome against the live application, and that is not something to do
# on a timer.
#
# Secrets it uses:
#   APP_BASE_URL    the deployment, https, no trailing slash   (required)
#   CRON_SECRET     to read which commit answered              (optional)
#   OWNER_PASSWORD  the owner account's password               (optional; the
#                   seed's documented default is used if unset)

on:
  workflow_dispatch:
    inputs:
      expect_commit:
        description: 'Commit the deployment must report (first 12 characters). Leave blank to skip.'
        required: false
        default: ''
      owner_email:
        description: 'Owner account to sign in as.'
        required: false
        default: 'owner@dealdispatch.test'

permissions:
  contents: read

concurrency:
  # One at a time. Two runs would each create a caller, assign the same three
  # practice records and reset the sandbox under one another.
  group: deployed-walkthrough
  cancel-in-progress: false

jobs:
  walkthrough:
    name: walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Walk the shift
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OWNER_EMAIL: ${{ inputs.owner_email }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          EXPECT_COMMIT: ${{ inputs.expect_commit }}
          EXPECT_MIGRATION: 20260813230000_message_failure_reason
        run: |
          set -u
          if [ -z "${BASE_URL:-}" ]; then
            echo "APP_BASE_URL must be set as a repository secret." >&2
            exit 1
          fi
          # The seed gives every account the same documented password. Falling
          # back to it keeps this runnable without a second secret, while a real
          # deployment that changed it only has to set OWNER_PASSWORD.
          if [ -z "${OWNER_PASSWORD:-}" ]; then
            echo "OWNER_PASSWORD is not set; using the seed's documented default."
            export OWNER_PASSWORD='demo-password-123'
          fi
          node scripts/deployedWalkthroughCheck.mjs
