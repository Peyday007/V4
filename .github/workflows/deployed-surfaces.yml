name: Deployed surfaces

# The pages an owner opens, against the real deployment, changing nothing.
#
# Separate from the deployed walkthrough on purpose. That one drives a shift —
# it creates a sandbox caller, assigns practice work and saves an outcome — and
# is manual because doing that against a live application is not something to
# put on a timer. This one only reads, so it is safe to run whenever anybody
# wants to know what production actually looks like.
#
# It runs from here rather than from a developer's machine because the machines
# this project is developed on sit behind an egress allowlist that does not
# include the deployment host. A browser started there cannot reach it at all,
# so "verified against the deployment" is a claim only this runner can make.
#
# Secrets it uses:
#   APP_BASE_URL    the deployment, https, no trailing slash   (required)
#   OWNER_PASSWORD  the owner account's password               (optional; the
#                   seed's documented default is used if unset)

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: 'Owner account to sign in as.'
        required: false
        default: 'owner@dealdispatch.test'

permissions:
  contents: read

concurrency:
  # Not strictly necessary — nothing here writes — but two browsers signing in
  # as the same owner produces confusing logs for no benefit.
  group: deployed-surfaces
  cancel-in-progress: true

jobs:
  surfaces:
    name: surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Read the deployment
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          OWNER_EMAIL: ${{ inputs.owner_email }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -u
          if [ -z "${BASE_URL:-}" ]; then
            echo "APP_BASE_URL must be set as a repository secret." >&2
            exit 1
          fi
          # The seed gives every account the same documented password. Falling
          # back to it keeps this runnable without a second secret, while a real
          # deployment that changed it only has to set OWNER_PASSWORD.
          if [ -z "${OWNER_PASSWORD:-}" ]; then
            echo "OWNER_PASSWORD is not set; using the seed's documented default."
            export OWNER_PASSWORD='demo-password-123'
          fi
          node scripts/deployedSurfacesCheck.mjs
